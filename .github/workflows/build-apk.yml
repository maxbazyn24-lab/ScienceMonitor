
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q ScienceMonitor_source_v0.7.0.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Build debug APK
        run: |
          cd source
          gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          cp source/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          test -f app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScienceMonitor-debug-apk
          path: app-debug.apk
          if-no-files-found: error
